version: "3.1"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lti_password}
      POSTGRES_USER: ${DB_USER:-lti_user}
      POSTGRES_DB: ${DB_NAME:-lti_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lti_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
